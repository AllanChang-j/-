experiment:
  name: lab_lightgbm_top80_h5_seq30
  seed: 42
  output_dir: experiments/lab_lightgbm_top80_h5_seq30
  save_tensorboard: false

data:
  input_path: data/raw/taiwan_daily_ohlcv_20240101_20260630.csv
  date_column: date
  symbol_column: symbol
  price_column: adjusted_close
  make_sample_if_missing: false

features:
  windows: [3, 5, 10, 14, 20, 30, 60]
  lag_windows: [1, 2, 3, 5, 10, 20]
  correlation_threshold: 0.96
  max_features: 80
  min_non_null_ratio: 0.85

labels:
  task: binary
  horizon: 5
  neutral_threshold: 0.01

dataset:
  sequence_length: 30
  test_size: 0.2
  validation_size: 0.2
  scale_features: true

validation:
  run_cross_validation: true
  method: walk_forward
  n_splits: 3
  train_window: 252
  validation_window: 63
  step_size: 63
  purge: 5
  embargo: 5
  expanding: true

training:
  device: cpu
  batch_size: 4096
  max_epochs: 1
  patience: 1
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip: 1.0
  scheduler: cosine
  num_workers: 0

hyperparameter_search:
  method: none
  max_trials: 1
  random_seed: 42

models:
  cnn:
    enabled: false
  lstm:
    enabled: false
  transformer:
    enabled: false
  lightgbm:
    enabled: true
    n_estimators: 1500
    learning_rate: 0.02
    num_leaves: 63
    max_depth: -1
    min_child_samples: 80
    subsample: 0.85
    subsample_freq: 1
    colsample_bytree: 0.85
    reg_alpha: 0.1
    reg_lambda: 0.5
    objective: binary
    n_jobs: -1
    force_col_wise: true
    early_stopping_rounds: 100
    log_evaluation_period: 50

backtest:
  initial_cash: 1000000
  commission_rate: 0.001425
  tax_rate: 0.003
  slippage_bps: 5
  position_size: 0.1
  max_positions: 5
  stop_loss: 0.08
  take_profit: 0.15
  long_threshold: 0.55
  short_threshold: 0.45
  allow_short: false
  allow_overlap_positions: false
  return_column: execution_return

reports:
  export_csv: true
  export_json: true
  export_excel: true
  figures_dpi: 160
