experiment:
  name: quick_ta_regression_deep_h5_seq20
  seed: 42
  output_dir: experiments/quick_ta_regression_deep_h5_seq20
  save_tensorboard: true

data:
  input_path: data/raw/taiwan_daily_ohlcv_20240101_20260630.csv
  date_column: date
  symbol_column: symbol
  price_column: adjusted_close
  make_sample_if_missing: false

features:
  profile: common_ta
  lag_windows: [1, 2, 3, 5]
  selection_method: none
  max_features: 64
  min_non_null_ratio: 0.70
  correlation_threshold: 0.98

labels:
  task: regression
  horizon: 5
  neutral_threshold: 0.01

dataset:
  sequence_length: 20
  test_size: 0.2
  validation_size: 0.2
  scale_features: true

validation:
  run_cross_validation: false
  method: walk_forward
  n_splits: 1
  train_window: 252
  validation_window: 63
  step_size: 63
  purge: 5
  embargo: 5
  expanding: true

training:
  device: auto
  batch_size: 8192
  max_epochs: 8
  patience: 3
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip: 1.0
  scheduler: cosine
  num_workers: 0

hyperparameter_search:
  method: none
  max_trials: 1
  random_seed: 42

models:
  cnn:
    enabled: true
    variant: cnn1d
    channels: [32, 64]
    kernel_size: 3
    dropout: 0.20
  lstm:
    enabled: true
    hidden_size: 64
    num_layers: 1
    bidirectional: false
    attention: false
    dropout: 0.20
  transformer:
    enabled: true
    d_model: 64
    n_heads: 4
    num_layers: 1
    dim_feedforward: 128
    dropout: 0.20
  lightgbm:
    enabled: false

backtest:
  initial_cash: 1000000
  commission_rate: 0.001425
  tax_rate: 0.003
  slippage_bps: 5
  position_size: 0.1
  max_positions: 5
  stop_loss: 0.08
  take_profit: 0.15
  long_threshold: 0.0
  short_threshold: 0.0
  allow_short: false
  allow_overlap_positions: false
  return_column: execution_return

reports:
  export_csv: true
  export_json: true
  export_excel: true
  figures_dpi: 160
