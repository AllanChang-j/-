experiment:
  name: official_20240101_20260630_h5_seq30_v1
  seed: 42
  output_dir: experiments/official_20240101_20260630_h5_seq30_v1
  save_tensorboard: true

data:
  input_path: data/raw/taiwan_daily_ohlcv_20240101_20260630.csv
  date_column: date
  symbol_column: symbol
  price_column: adjusted_close
  make_sample_if_missing: false

features:
  windows: [3, 5, 10, 14, 20, 30, 60]
  lag_windows: [1, 2, 3, 5, 10, 20]
  correlation_threshold: 0.96
  max_features: 40
  min_non_null_ratio: 0.85

labels:
  task: binary
  horizon: 5
  neutral_threshold: 0.01

dataset:
  sequence_length: 30
  test_size: 0.2
  validation_size: 0.2
  scale_features: true

validation:
  run_cross_validation: false
  method: walk_forward
  n_splits: 3
  train_window: 252
  validation_window: 63
  step_size: 63
  purge: 5
  embargo: 5
  expanding: true

training:
  device: auto
  batch_size: 2048
  max_epochs: 5
  patience: 2
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip: 1.0
  scheduler: cosine
  num_workers: 0

hyperparameter_search:
  method: none
  max_trials: 1
  random_seed: 42

models:
  cnn:
    enabled: true
    variant: cnn1d
    channels: [32, 64]
    kernel_size: 3
    dropout: 0.25
  lstm:
    enabled: true
    hidden_size: 64
    num_layers: 1
    bidirectional: false
    attention: true
    dropout: 0.25
  transformer:
    enabled: true
    d_model: 64
    n_heads: 4
    num_layers: 2
    dim_feedforward: 128
    dropout: 0.2
  lightgbm:
    enabled: true
    n_estimators: 500
    learning_rate: 0.03
    max_depth: -1
    num_leaves: 31
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 0.1

backtest:
  initial_cash: 1000000
  commission_rate: 0.001425
  tax_rate: 0.003
  slippage_bps: 5
  position_size: 0.1
  max_positions: 5
  stop_loss: 0.08
  take_profit: 0.15
  long_threshold: 0.55
  short_threshold: 0.45
  allow_short: false
  allow_overlap_positions: false
  return_column: execution_return

reports:
  export_csv: true
  export_json: true
  export_excel: true
  figures_dpi: 160
