experiment:
  name: daily_trend_lightgbm_rank_v2_h5
  seed: 42
  output_dir: experiments/daily_trend_lightgbm_rank_v2_h5
  save_tensorboard: false

data:
  input_path: data/raw/taiwan_daily_ohlcv_20240101_20260630.csv
  date_column: date
  symbol_column: symbol
  price_column: adjusted_close
  make_sample_if_missing: false

features:
  profile: common_ta
  lag_windows: [1, 2, 3, 5]
  selection_method: fixed
  max_features: 80
  min_non_null_ratio: 0.70
  correlation_threshold: 0.98
  selected_features:
    - daily_return
    - weekly_return
    - monthly_return
    - log_return
    - overnight_return
    - intraday_return
    - high_low_range
    - close_open_range
    - close_to_ma_5
    - close_to_ma_10
    - close_to_ma_20
    - close_to_ma_60
    - close_to_ema_5
    - close_to_ema_10
    - close_to_ema_20
    - close_to_ema_60
    - rolling_return_5
    - rolling_return_10
    - rolling_return_20
    - rolling_return_60
    - high_position_5
    - high_position_10
    - high_position_20
    - high_position_60
    - low_position_5
    - low_position_10
    - low_position_20
    - low_position_60
    - range_position_5
    - range_position_10
    - range_position_20
    - range_position_60
    - rolling_drawdown_5
    - rolling_drawdown_10
    - rolling_drawdown_20
    - rolling_drawdown_60
    - atr_14
    - atr_ratio_14
    - historical_volatility_20
    - historical_volatility_60
    - bollinger_width_20
    - bollinger_z_20
    - rsi_14
    - rsi_30
    - stochastic_14
    - stochastic_30
    - macd
    - macd_signal
    - macd_hist
    - ppo
    - volume_ratio_5
    - volume_ratio_10
    - volume_ratio_20
    - volume_ratio_60
    - amount_ratio_20
    - obv
    - close_to_vwap
    - daily_return_lag_1
    - daily_return_lag_2
    - daily_return_lag_3
    - daily_return_lag_5
    - weekly_return_lag_1
    - weekly_return_lag_2
    - weekly_return_lag_3
    - weekly_return_lag_5
    - rsi_14_lag_1
    - rsi_14_lag_2
    - rsi_14_lag_3
    - macd_hist_lag_1
    - macd_hist_lag_2
    - macd_hist_lag_3
    - volume_ratio_20_lag_1
    - volume_ratio_20_lag_2
    - volume_ratio_20_lag_3
    - close_to_ma_20_lag_1
    - close_to_ma_20_lag_2
    - range_position_20_lag_1
    - rolling_drawdown_20_lag_1
    - weekday
    - month

labels:
  task: regression
  regression_target: daily_future_return_percentile
  horizon: 5
  neutral_threshold: 0.01

dataset:
  sequence_length: 1
  test_size: 0.2
  validation_size: 0.2
  scale_features: true

validation:
  run_cross_validation: true
  method: walk_forward
  n_splits: 3
  train_window: 252
  validation_window: 63
  step_size: 63
  purge: 5
  embargo: 5
  expanding: true

training:
  device: cpu
  batch_size: 8192
  max_epochs: 1
  patience: 1
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip: 1.0
  scheduler: cosine
  num_workers: 0

hyperparameter_search:
  method: none
  max_trials: 1
  random_seed: 42

models:
  cnn:
    enabled: false
  lstm:
    enabled: false
  transformer:
    enabled: false
  lightgbm:
    enabled: true
    n_estimators: 1200
    learning_rate: 0.02
    num_leaves: 63
    max_depth: -1
    min_child_samples: 120
    subsample: 0.85
    subsample_freq: 1
    colsample_bytree: 0.85
    reg_alpha: 0.05
    reg_lambda: 0.8
    objective: regression
    n_jobs: -1
    force_col_wise: true
    early_stopping_rounds: 100
    log_evaluation_period: 50

backtest:
  initial_cash: 1000000
  commission_rate: 0.001425
  tax_rate: 0.003
  slippage_bps: 5
  position_size: 0.1
  max_positions: 5
  stop_loss: 0.08
  take_profit: 0.15
  long_threshold: 0.8
  short_threshold: 0.2
  allow_short: false
  allow_overlap_positions: false
  return_column: execution_return

reports:
  export_csv: true
  export_json: true
  export_excel: true
  figures_dpi: 160
